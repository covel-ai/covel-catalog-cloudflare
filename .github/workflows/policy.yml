name: Publish reviewed policy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: catalog-policy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:vendor
      - run: node scripts/policy.mjs catalog/policy.json
        env:
          CATALOG_API_URL: ${{ vars.CATALOG_API_URL }}
          CATALOG_POLICY_TOKEN: ${{ secrets.CATALOG_POLICY_TOKEN }}
